# coturn TURN server configuration for Shmax
# Deployed by scripts/coturn/setup_coturn.sh

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Oracle Cloud NAT: public IP mapped to private IP
external-ip=__PUBLIC_IP__/__PRIVATE_IP__

# Relay port range (restricted to minimize firewall surface)
min-port=49152
max-port=50175

realm=__DOMAIN__
server-name=__DOMAIN__

# TLS certificates (read directly from Let's Encrypt; turnserver has ACL read access)
cert=/etc/letsencrypt/live/__DOMAIN__/fullchain.pem
pkey=/etc/letsencrypt/live/__DOMAIN__/privkey.pem

# Long-term credential mechanism
lt-cred-mech
user=__TURN_USER__:__TURN_PASS__

# Security: deny relay to private networks
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# Bandwidth limits (shared VPS — don't hog all bandwidth)
# 1 Mbps per session, 100 sessions worth of total quota
max-bps=1000000
total-quota=100

# Stale nonce lifetime
stale-nonce=600

# Logging
log-file=/var/log/coturn/turnserver.log
simple-log
no-stdout-log

# Process user
proc-user=turnserver
proc-group=turnserver

# Fingerprint (required by RFC 5766)
fingerprint

# Disable CLI (not needed)
no-cli
